name: Sync from company repo

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          git remote add company https://github.com/alex-ophx/Ophthalytics.git
          git fetch company main
          git checkout main
          git merge --ff-only company/main
          git push origin main
